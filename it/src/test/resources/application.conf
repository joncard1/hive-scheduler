# Specify the user and password either in environment variables or on the command-line. For instance, in VS Code, use .test-jvmopts to specify -Dpostgres_db.username=<username> and -Dpostgres_db.password=<password>.
# These values can also be overridden.
postgres_db {
  connectionPool = "HikariCP" //use HikariCP for our connection pool
  dataSourceClass = "org.postgresql.ds.PGSimpleDataSource" //Simple datasource with no connection pooling. The connection pool has already been specified with HikariCP.
  properties = {
    serverName = "localhost"
    portNumber = "5432"
    databaseName = "test"
  }
  numThreads = 10
}